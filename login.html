<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oak &amp; Aster | Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Prata&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="page-glow page-glow-one"></div>
    <div class="page-glow page-glow-two"></div>

    <header class="site-header">
        <a href="/" class="brand">Oak<span>&amp;Aster</span></a>
        <nav class="site-nav">
            <a href="/">Home</a>
            <a href="/events.html">Events</a>
            <a href="/booking.html">Booking</a>
            <a href="/register.html">Register</a>
            <a href="/admin.html" class="nav-pill">Admin Panel</a>
        </nav>
    </header>

    <main class="page-shell">
        <section class="auth-layout reveal">
            <div class="auth-copy">
                <p class="eyebrow">User Login</p>
                <h1>Access your event planning account.</h1>
                <p>
                    Log in to continue with event bookings and account access. For admin demo access, use:
                    <strong>admin@oakandaster.com</strong> and <strong>Admin@123</strong>.
                </p>
            </div>

            <form id="loginForm" class="auth-card">
                <label>
                    <span>Email Address</span>
                    <input type="email" id="loginEmail" placeholder="you@example.com" required>
                </label>
                <label>
                    <span>Password</span>
                    <input type="password" id="loginPassword" placeholder="Enter your password" required>
                </label>
                <button type="submit" class="primary-btn wide-btn">Login</button>
                <p id="loginResponse" class="form-response" aria-live="polite"></p>
                <p class="auth-switch">New here? <a href="/register.html">Create an account</a></p>
            </form>
        </section>
    </main>

    <script src="app.js"></script>
    <script src="auth.js"></script>
</body>
</html>
